[package]
name = "rustudio-account"
description = "Windows Credential Manager Roblox account layer for rustudio: .ROBLOSECURITY session, place listing, download and publishing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.23"
dirs = "6"
flate2 = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
