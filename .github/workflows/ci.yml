name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

jobs:
  check-and-test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --features skip-physics-tests

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bins
      - name: Package
        shell: pwsh
        run: |
          $d = "dist/RuStudio-windows-x64"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/rustudio.exe, target/release/rustudio-mcp.exe, api-dump.json, LICENSE-MIT, LICENSE-APACHE, README.md $d
          Copy-Item tools/windows/* $d
          Compress-Archive -Path $d -DestinationPath dist/RuStudio-windows-x64.zip -Force
      - name: Verify Windows installation
        shell: pwsh
        run: tools/windows/test-package.ps1 -Archive dist/RuStudio-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RuStudio-windows-x64
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RuStudio-windows-x64
          path: dist
      - name: Checksums
        shell: pwsh
        run: |
          Push-Location dist
          Get-ChildItem -File | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.Name).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          } | Set-Content -Encoding Ascii SHA256SUMS
          Get-Content SHA256SUMS
          Pop-Location
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "No release exists for $env:GITHUB_REF_NAME. Draft it first, then re-run this job."
            exit 1
          }
          gh release upload "$env:GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
